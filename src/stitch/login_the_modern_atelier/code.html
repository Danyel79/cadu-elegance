<!DOCTYPE html>

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        font-size: 20px;
      }
      .glass-effect {
        background: rgba(19, 19, 19, 0.8);
        backdrop-filter: blur(24px);
      }
      .gold-gradient {
        background: linear-gradient(135deg, #f2ca50 0%, #d4af37 100%);
      }
      .text-glow:focus {
        text-shadow: 0 0 8px rgba(242, 202, 80, 0.4);
      }

<body class="bg-background text-on-surface font-body antialiased min-h-screen flex items-center justify-center selection:bg-primary-container selection:text-on-primary">
<!-- Background Texture -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute inset-0 opacity-20" data-alt="Moody dark atmospheric barbershop interior with leather chairs and vintage mahogany details in soft high-contrast lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBqOwE08MCgq-xekfOc-gIfbZ31tiORjGl4hvGHSkXrh1njETLXXe5ZU3_RsIZBZPYBD1vPi4Il9SfcvU5lZzu71kfz5E-w4Nm6lBn8IeIu3Ohs-3OKxclfBgd_zVAD5Y9TZUejvM7ehb2y4SvgrJSPydcYohgvnAqndUzqqVjlDNbVXTmUyQrJoM3aHnk-sy0MYt8KTK_M_HJhlFWcqZxY39-y-0mBNxB8r2LSrDUVdjXoDaSrdX7t5n-PISPPGGiRDuEMA9rfGuM'); background-size: cover; background-position: center;">
</div>
<div class="absolute inset-0 bg-gradient-to-b from-background via-transparent to-background"></div>
</div>
<!-- Main Auth Canvas -->
<main class="relative z-10 w-full max-w-md px-6 py-12">
<!-- Header Branding -->
<div class="text-center mb-12">
<h1 class="font-headline text-3xl font-bold tracking-[0.25em] text-primary uppercase mb-2">THE ATELIER</h1>
<p class="font-label text-[10px] tracking-[0.4em] text-on-surface-variant uppercase opacity-70">Privé Grooming Club</p>
</div>
<!-- Authentication Card -->
<div class="glass-effect rounded-lg p-8 shadow-[0_20px_40px_rgba(0,0,0,0.6)] border border-outline-variant/10">
<div class="mb-8">
<span class="font-label text-[10px] tracking-widest text-primary uppercase block mb-1">Welcome Back</span>
<h2 class="font-headline text-2xl text-on-surface">Client Authentication</h2>
</div>
<form class="space-y-8">
<!-- Input Fields -->
<div class="space-y-6">
<div class="group relative">
<label class="block font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-1 group-focus-within:text-primary transition-colors">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/40 py-3 px-0 text-on-surface focus:ring-0 focus:border-primary transition-all placeholder:text-stone-700 font-medium" placeholder="master@atelier.com" type="email"/>
</div>
<div class="group relative">
<div class="flex justify-between items-end mb-1">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant group-focus-within:text-primary transition-colors">Password</label>
<a class="font-label text-[10px] uppercase tracking-widest text-stone-500 hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/40 py-3 px-0 text-on-surface focus:ring-0 focus:border-primary transition-all placeholder:text-stone-700 font-medium" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full gold-gradient text-on-primary font-label text-[11px] font-bold uppercase tracking-[0.2em] py-5 rounded shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Access The Atelier
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-10 gap-4">
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
<span class="font-label text-[10px] uppercase tracking-widest text-stone-600">Secure Access</span>
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-high hover:bg-surface-container-highest border border-outline-variant/10 py-3 rounded transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">google</span>
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-high hover:bg-surface-container-highest border border-outline-variant/10 py-3 rounded transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary">ios</span>
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-10 text-center space-y-4">
<p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">
                New to the membership? 
                <a class="text-primary font-bold ml-1 hover:underline" href="#">Apply for Entry</a>
</p>
<div class="flex justify-center gap-6 pt-4 border-t border-outline-variant/10">
<a class="font-label text-[9px] uppercase tracking-[0.2em] text-stone-600 hover:text-stone-400" href="#">Terms of Service</a>
<a class="font-label text-[9px] uppercase tracking-[0.2em] text-stone-600 hover:text-stone-400" href="#">Privacy Policy</a>
</div>
</div>
</main>
<!-- Floating Branding Accent -->
<div class="fixed bottom-8 right-8 hidden lg:block opacity-40">
<div class="flex flex-col items-end">
<div class="h-12 w-[1px] bg-primary mb-4"></div>
<span class="font-headline italic text-on-surface text-xl">The art of grooming</span>
</div>
</div>
</body></html>
